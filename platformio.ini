[env:ATmega32]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
upload_protocol = usbasp
upload_flags =
    -e
    -V

build_flags =
    -I lib/LIB
    -I lib/MCAL/DIO
    -I lib/MCAL/ADC
    -I lib/MCAL/EXTI
    -I lib/MCAL/GI
    -I lib/MCAL/SPI
    -I lib/MCAL/TIM0
    -I lib/MCAL/TIM1
    -I lib/MCAL/UART
    -I lib/HAL/KPD
    -I lib/HAL/LCD
    -I lib/HAL/LED
    -I lib/HAL/SSD

lib_extra_dirs = 
    lib/MCAL
    lib/HAL

lib_ldf_mode = deep